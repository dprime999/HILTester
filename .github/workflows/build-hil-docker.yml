name: Build HIL Docker Image

on:
  # Automatically rebuild the HIL environment ONLY when
  # Docker/infrastructure files change on this branch.
  push:
    branches:
      - feature/docker-hil-runner
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "docker-compose.yml"
      - ".github/workflows/build-hil-docker.yml"

  # Also allow rebuilding it manually from the GitHub Actions page.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dprime999/hiltester-runner

jobs:
  build-and-publish:
    name: Build ARM64 HIL Runner Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 HIL image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dprime999/hiltester-runner:latest
            ghcr.io/dprime999/hiltester-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "HIL Docker image published successfully."
          echo "Latest:"
          echo "ghcr.io/dprime999/hiltester-runner:latest"
          echo
          echo "Exact commit image:"
          echo "ghcr.io/dprime999/hiltester-runner:${GITHUB_SHA}"

