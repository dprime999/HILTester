name: Flash Pico and STM32F4

on:
  push:
    branches: [ "main" ]

  # Also allows you to start it manually from the Actions page.
  workflow_dispatch:

permissions:
  contents: read

# Prevent two pushes from trying to use the programmers simultaneously.
concurrency:
  group: hil-hardware-flashing
  cancel-in-progress: false

jobs:
  flash-hardware:
    name: Flash Pico then STM32F4
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PICO_SDK_PATH: /home/dprime999/pico/pico/pico-sdk


    steps:
      - name: Check out pushed files
        uses: actions/checkout@v6

      - name: Verify required source files and tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking firmware source..."
          test -f "${GITHUB_WORKSPACE}/blink/blink.c"
          test -f "${GITHUB_WORKSPACE}/blink2/CMakeLists.txt"

          echo "Checking flashing tools..."
          command -v picotool
          command -v openocd

          picotool version
          openocd --version

      - name: Configure and build Pico project
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "${GITHUB_WORKSPACE}/blink" -B "${GITHUB_WORKSPACE}/blink/build"
          cmake --build "${GITHUB_WORKSPACE}/blink/build" -j"$(nproc)"

      - name: Configure and build STM32 project
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "${GITHUB_WORKSPACE}/blink2" -B "${GITHUB_WORKSPACE}/blink2/build" \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/blink2/cmake/gcc-arm-none-eabi.cmake"
          cmake --build "${GITHUB_WORKSPACE}/blink2/build" -j"$(nproc)"

      - name: Flash Raspberry Pi Pico first
        shell: bash
        run: |
          set -euo pipefail

          echo "Flashing Pico with blink.uf2..."

          picotool load \
            -f \
            -v \
            "${GITHUB_WORKSPACE}/blink/build/blink.uf2"

          echo "Pico flashing completed successfully."

      - name: Wait for USB devices to settle
        shell: bash
        run: sleep 3

      - name: Flash STM32F4 second
        shell: bash
        run: |
          set -euo pipefail

          echo "Flashing STM32F4 with blink2.elf..."

          openocd \
            -f interface/stlink.cfg \
            -f target/stm32f4x.cfg \
            -c "program ${GITHUB_WORKSPACE}/blink2/build/blink2.elf verify reset exit"

          echo "STM32F4 flashing completed successfully."

      - name: Upload All Compiled Firmware to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mcu-firmware
          path: |
            blink/build/blink.uf2
            blink2/build/blink2.elf

      - name: Deployment summary
        shell: bash
        run: |
          echo "Hardware deployment completed."