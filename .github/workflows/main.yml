name: Flash Pico and STM32F4

on:
  push:
    branches: [ "main" ]

  # Also allows you to start it manually from the Actions page.
  workflow_dispatch:

permissions:
  contents: read

# Prevent two pushes from trying to use the programmers simultaneously.
concurrency:
  group: hil-hardware-flashing
  cancel-in-progress: false

jobs:
  flash-hardware:
    name: Flash Pico then STM32F4
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Check out pushed files
        uses: actions/checkout@v6

      - name: Verify required files and tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking firmware files..."
          test -f "${GITHUB_WORKSPACE}/blink.c"
          test -f "${GITHUB_WORKSPACE}/blink2.c"

          echo "Checking flashing tools..."
          command -v picotool
          command -v openocd

          picotool version
          openocd --version

      - name: Build STM32 Project on Pi
        shell: bash
        run: |
          mkdir -p /home/dprime999/hiltester/stm32_build
          cd /home/dprime999/hiltester/stm32_build
          cmake ../one layer deeper? -DCMAKE_TOOLCHAIN_FILE=../arm-none-eabi-toolchain.cmake
          cd ..
          make -j$(nproc)

      - name: Build Pico Project on Pi
        shell: bash
        run: |
          mkdir -p /home/dprime999/hiltester/pico_build
          cd /home/dprime999/hiltester/pico_build
          cmake ../one layer deeper? 
          cd ..
          make -j$(nproc)

          
      - name: Flash Raspberry Pi Pico first
        shell: bash
        run: |
          set -euo pipefail

          echo "Flashing Pico with blink.uf2..."

          picotool load \
            -f \
            -v \
            /home/dprime999/hiltester/blink.uf2

          echo "Pico flashing completed successfully."

      - name: Wait for USB devices to settle
        shell: bash
        run: sleep 3

      - name: Flash STM32F4 second
        shell: bash
        run: |
          set -euo pipefail

          echo "Flashing STM32F4 with blink2.elf..."

          openocd \
            -f interface/stlink.cfg \
            -f target/stm32f4x.cfg \
            -c "program /home/dprime999/hiltester/blink2.elf verify reset exit"

          echo "STM32F4 flashing completed successfully."

      - name: Upload All Compiled Firmware to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mcu-firmware
          path: |
            build_pico/*.uf2
            build_stm32/*.elf 

      - name: Deployment summary
        shell: bash
        run: |
          echo "Hardware deployment completed."

